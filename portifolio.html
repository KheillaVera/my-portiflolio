<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Portfolio | NGA Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,900;1,400&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<body>

    <nav class="glass-nav">

            <div class="brand">NGA — 2026</div>
            <div class="nav-links">

                <a href="#about">About</a>

        </div>

                    <div class="work-meta">
